<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Заказ и доставка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&family=Caveat:wght@600&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #e4572e;
  --primary-dark: #c2410c;
  --primary-soft: #fdece5;
  --green: #1f9d55;
  --green-soft: #e6f6ec;
  --red: #dc2626;
  --bg: #faf6f1;
  --card: #ffffff;
  --text: #1f1a17;
  --muted: #8a817a;
  --line: #efe9e3;
  --chip: #f4efe9;
  --shadow: 0 6px 24px rgba(60,35,20,0.08);
  --shadow-sm: 0 2px 10px rgba(60,35,20,0.06);
  --r-sm: 12px; --r-md: 18px; --r-lg: 24px; --r-full: 9999px;
  --font: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --sb: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="dark"] {
  --primary: #f26a3f; --primary-dark: #fb8a5c; --primary-soft: #3a2218;
  --green: #34c26f; --green-soft: #133021;
  --bg: #131110; --card: #1e1b19; --text: #f6f2ee; --muted: #a69c94; --line: #2e2926; --chip: #2a2522;
  --shadow: 0 6px 24px rgba(0,0,0,0.4); --shadow-sm: 0 2px 10px rgba(0,0,0,0.3);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.4; overscroll-behavior-y: none; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; }
img { display: block; max-width: 100%; }
.hide-scroll { scrollbar-width: none; } .hide-scroll::-webkit-scrollbar { display: none; }

.screen { display: none; padding: 14px 16px calc(112px + var(--sb)); min-height: 100vh; max-width: 560px; margin: 0 auto; }
.screen.active { display: block; animation: scr-in .3s cubic-bezier(.16,1,.3,1); }
@keyframes scr-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen.active, .sheet, .sheet-back { animation: none !important; transition: none !important; } }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.logo { width: 44px; height: 44px; border-radius: 14px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.25rem; flex-shrink: 0; box-shadow: 0 6px 14px rgba(228,87,46,.35); }
.brand { flex: 1; min-width: 0; }
.brand-name { font-size: 1.15rem; font-weight: 900; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-tag { font-size: 0.74rem; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text); text-decoration: none; }
.icon-btn svg { width: 20px; height: 20px; }

.addr { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: var(--r-md); padding: 12px 12px 12px 14px; box-shadow: var(--shadow-sm); margin-bottom: 16px; }
.addr-ico { color: var(--primary); flex-shrink: 0; }
.addr-body { flex: 1; min-width: 0; text-align: left; }
.addr-lbl { font-size: 0.72rem; color: var(--muted); font-weight: 700; }
.addr-val { font-size: 0.9rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.addr-search { width: 40px; height: 40px; border-radius: 12px; background: var(--chip); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* ---------- promo ---------- */
.promos { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 0 16px 4px; }
.promo { position: relative; flex: 0 0 100%; scroll-snap-align: center; border-radius: var(--r-lg); overflow: hidden; aspect-ratio: 16/10; background: var(--primary); box-shadow: var(--shadow); text-align: left; }
.promo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.promo { background: #0b0b0b; }
.promo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(95deg, rgba(8,8,8,.92) 0%, rgba(8,8,8,.7) 45%, rgba(8,8,8,0) 75%); }
.promo-body { position: relative; z-index: 1; padding: 20px 18px; height: 100%; display: flex; flex-direction: column; justify-content: center; max-width: 64%; color: #fff; }
.promo-title { font-size: 1.35rem; font-weight: 900; line-height: 1.12; letter-spacing: -0.4px; }
.promo-sub { font-size: 0.8rem; margin-top: 6px; opacity: .92; font-weight: 500; }
.promo-btn { margin-top: 14px; align-self: flex-start; background: var(--primary); color: #fff; font-weight: 800; font-size: 0.82rem; padding: 10px 16px; border-radius: var(--r-full); display: inline-flex; gap: 8px; align-items: center; }
.dots { display: flex; justify-content: center; gap: 6px; margin: 10px 0 18px; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--line); transition: all .25s; }
.dots i.on { width: 18px; background: var(--primary); }

/* ---------- categories ---------- */
.cat-tiles { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px 20px; padding: 2px 16px 6px; }
.cat-tiles.rows { display: grid; grid-auto-flow: row; column-gap: 10px; row-gap: 12px; align-items: start; }
.cat-tile { flex: 0 0 auto; width: 74px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.cat-tile .ic { width: 64px; height: 64px; border-radius: 20px; background: var(--card); box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: center; font-size: 1.75rem; }
.cat-tile.hot .ic { background: var(--primary-soft); }
.cat-tile span { font-size: 0.72rem; font-weight: 700; text-align: center; line-height: 1.15; }

.sec-head { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 0 12px; }
.sec-title { font-size: 1.12rem; font-weight: 900; letter-spacing: -0.2px; }
.sec-link { font-size: 0.82rem; font-weight: 800; color: var(--primary); }

/* ---------- product cards ---------- */
.pop-row { display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px 20px; padding: 0 16px 8px; }
.pcard { background: var(--card); border-radius: var(--r-md); box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column; text-align: left; position: relative; }
.pop-row .pcard { flex: 0 0 152px; }
.pcard.off { opacity: .5; }
.pcard-img { aspect-ratio: 1/1; background: #0b0b0b; position: relative; overflow: hidden; }
.pcard-img img { width: 100%; height: 100%; object-fit: cover; }
.pcard-img .emo { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
.tag-hit { position: absolute; top: 8px; left: 8px; background: var(--primary); color: #fff; font-size: 0.62rem; font-weight: 900; text-transform: uppercase; letter-spacing: .3px; padding: 3px 7px; border-radius: 7px; }
.tag-off { position: absolute; inset: auto 8px 8px 8px; background: rgba(31,26,23,.85); color: #fff; font-size: 0.7rem; font-weight: 800; padding: 4px 8px; border-radius: 8px; text-align: center; }
.pcard-body { padding: 10px 11px 11px; display: flex; flex-direction: column; flex: 1; }
.pcard-name { font-size: 0.86rem; font-weight: 800; line-height: 1.22; min-height: 2.44em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pcard-w { font-size: 0.7rem; color: var(--muted); font-weight: 600; margin-top: 2px; }
.pcard-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; gap: 6px; }
.price { font-weight: 900; font-size: 0.92rem; color: var(--primary); white-space: nowrap; }
.plus { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 10px rgba(228,87,46,.35); line-height: 1; }
.mini-step { display: inline-flex; align-items: center; background: var(--primary); color: #fff; border-radius: var(--r-full); height: 32px; }
.mini-step button { width: 28px; height: 32px; color: #fff; font-size: 1.05rem; font-weight: 800; }
.mini-step span { min-width: 16px; text-align: center; font-weight: 900; font-size: 0.85rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ---------- info card ---------- */
.info-card { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: var(--r-md); box-shadow: var(--shadow-sm); padding: 14px; margin-bottom: 14px; }
.info-ico { width: 46px; height: 46px; border-radius: 50%; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
.info-body { flex: 1; min-width: 0; }
.info-title { font-weight: 900; color: var(--primary); font-size: 0.92rem; }
.info-sub { font-size: 0.76rem; color: var(--muted); font-weight: 600; margin-top: 1px; }
.dark-pill { background: var(--text); color: var(--bg); font-weight: 800; font-size: 0.8rem; padding: 10px 14px; border-radius: var(--r-full); flex-shrink: 0; }
.closed-card { background: #1f1a17; color: #fff; border-radius: var(--r-md); padding: 12px 14px; font-weight: 700; font-size: 0.86rem; margin-bottom: 14px; }

/* ---------- menu screen ---------- */
.menu-head { position: sticky; top: 0; z-index: 20; background: var(--bg); margin: -14px -16px 6px; padding: 14px 16px 8px; }
.search { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: var(--r-md); box-shadow: var(--shadow-sm); padding: 0 14px; margin-bottom: 10px; }
.search input { flex: 1; border: none; background: transparent; padding: 13px 0; font-size: 16px; color: var(--text); outline: none; }
.search svg { color: var(--muted); flex-shrink: 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; }
.chip { white-space: nowrap; padding: 9px 14px; border-radius: var(--r-full); background: var(--card); font-size: 0.82rem; font-weight: 800; box-shadow: var(--shadow-sm); }
.chip.on { background: var(--primary); color: #fff; }
.chips.rows { display: flex; flex-direction: column; gap: 8px; }
.chips.rows .chip-row { display: flex; gap: 8px; width: max-content; }
.menu-head { transition: transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s; will-change: transform; }
.menu-head.hid { transform: translateY(calc(-100% - 4px)); }
.cat-title { font-size: 1.05rem; font-weight: 900; margin: 18px 0 12px; scroll-margin-top: 130px; }

/* ---------- page header ---------- */
.phead { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.back { width: 42px; height: 42px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ptitle { font-size: 1.25rem; font-weight: 900; letter-spacing: -0.3px; flex: 1; }
.plink { font-size: 0.82rem; font-weight: 800; color: var(--muted); }

/* ---------- cart ---------- */
.card { background: var(--card); border-radius: var(--r-md); box-shadow: var(--shadow-sm); padding: 14px; margin-bottom: 12px; }
.card-title { font-size: 0.95rem; font-weight: 900; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.card-title .n { width: 22px; height: 22px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 0.72rem; display: flex; align-items: center; justify-content: center; }
.crow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.crow:last-child { border-bottom: none; padding-bottom: 2px; }
.crow:first-child { padding-top: 2px; }
.crow-img { width: 58px; height: 58px; border-radius: 14px; overflow: hidden; background: var(--chip); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
.crow-img img { width: 100%; height: 100%; object-fit: cover; }
.crow-info { flex: 1; min-width: 0; }
.crow-name { font-size: 0.88rem; font-weight: 800; line-height: 1.25; }
.crow-price { font-size: 0.84rem; font-weight: 900; color: var(--primary); margin-top: 3px; }
.stepper { display: inline-flex; align-items: center; background: var(--chip); border-radius: var(--r-full); flex-shrink: 0; }
.stepper button { width: 32px; height: 32px; font-size: 1.1rem; font-weight: 800; color: var(--text); }
.stepper span { min-width: 20px; text-align: center; font-weight: 900; font-size: 0.88rem; }
.srow { display: flex; justify-content: space-between; gap: 10px; font-size: 0.88rem; padding: 4px 0; }
.srow .m { color: var(--muted); font-weight: 600; }
.srow.total { font-size: 1.08rem; font-weight: 900; padding-top: 10px; margin-top: 6px; border-top: 1px dashed var(--line); }
.hint { font-size: 0.8rem; font-weight: 700; border-radius: var(--r-sm); padding: 11px 12px; margin-bottom: 12px; }
.hint.warn { background: var(--primary-soft); color: var(--primary-dark); }
.hint.ok { background: var(--green-soft); color: var(--green); }
.bar { height: 6px; background: rgba(0,0,0,.08); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.bar > div { height: 100%; background: var(--primary); border-radius: 3px; }

/* ---------- checkout ---------- */
.seg { display: flex; background: var(--chip); border-radius: 14px; padding: 4px; }
.seg button { flex: 1; padding: 11px 8px; border-radius: 11px; font-weight: 800; font-size: 0.88rem; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow-sm); }
.field { margin-top: 10px; }
.field:first-child { margin-top: 0; }
.flabel { display: block; font-size: 0.76rem; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
.input { width: 100%; padding: 13px 14px; border-radius: 14px; background: var(--bg); border: 1.5px solid var(--line); color: var(--text); font-size: 16px; }
.input:focus { outline: none; border-color: var(--primary); background: var(--card); }
.input.err { border-color: var(--red); }
textarea.input { resize: vertical; min-height: 64px; }
.geo { margin-top: 8px; font-size: 0.82rem; font-weight: 800; color: var(--primary); display: inline-flex; gap: 6px; align-items: center; padding: 4px 0; }
.geo-ok { font-size: 0.78rem; color: var(--green); font-weight: 700; margin-top: 4px; }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { padding: 10px 4px; border-radius: 12px; border: 1.5px solid var(--line); font-size: 0.8rem; font-weight: 800; text-align: center; background: var(--card); }
.slot.wide { grid-column: span 3; }
.slot.on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-dark); }
.pay { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; border: 1.5px solid var(--line); margin-top: 8px; width: 100%; text-align: left; }
.pay:first-child { margin-top: 0; }
.pay .pi { width: 38px; height: 38px; border-radius: 11px; background: var(--chip); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
.pay .pt { flex: 1; font-weight: 800; font-size: 0.9rem; }
.pay .ps { display: block; font-size: 0.74rem; color: var(--muted); font-weight: 600; }
.pay .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; position: relative; }
.pay.on { border-color: var(--primary); }
.pay.on .radio { border-color: var(--primary); }
.pay.on .radio::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--primary); }
.err-box { background: #fee2e2; color: #991b1b; border-radius: var(--r-sm); padding: 11px 12px; font-size: 0.85rem; font-weight: 700; margin-bottom: 12px; display: none; }
.err-box.show { display: block; }

/* ---------- status ---------- */
.st-hero { background: var(--green); color: #fff; border-radius: var(--r-lg); padding: 20px 18px; margin-bottom: 12px; display: flex; gap: 14px; align-items: center; box-shadow: 0 10px 24px rgba(31,157,85,.25); }
.st-hero.wait { background: var(--primary); box-shadow: 0 10px 24px rgba(228,87,46,.28); }
.st-hero.cancel { background: #57534e; box-shadow: none; }
.st-ico { width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; font-size: 1.7rem; flex-shrink: 0; }
.st-title { font-size: 1.2rem; font-weight: 900; line-height: 1.15; }
.st-sub { font-size: 0.8rem; opacity: .9; margin-top: 3px; font-weight: 600; }
.track { list-style: none; }
.track li { display: flex; gap: 12px; position: relative; padding-bottom: 16px; }
.track li:last-child { padding-bottom: 0; }
.track li::before { content: ''; position: absolute; left: 11px; top: 24px; bottom: 0; width: 2px; background: var(--line); }
.track li:last-child::before { display: none; }
.dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: #fff; font-weight: 900; z-index: 1; }
.track li.done .dot { background: var(--green); border-color: var(--green); }
.track li.done::before { background: var(--green); }
.track li.now .dot { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 0 5px var(--primary-soft); }
.tl { font-size: 0.9rem; font-weight: 800; padding-top: 2px; }
.track li:not(.done):not(.now) .tl { color: var(--muted); font-weight: 600; }
.tt { font-size: 0.74rem; color: var(--muted); font-weight: 600; }
.btn-row { display: flex; gap: 10px; }
.btn { flex: 1; padding: 14px; border-radius: 16px; font-weight: 800; font-size: 0.92rem; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--primary); color: #fff; }
.btn.ghost { background: var(--card); box-shadow: var(--shadow-sm); color: var(--text); }
.badge { font-size: 0.7rem; font-weight: 800; border-radius: var(--r-full); padding: 4px 10px; background: var(--primary-soft); color: var(--primary-dark); white-space: nowrap; }
.badge.done { background: var(--green-soft); color: var(--green); }
.badge.cancelled { background: var(--chip); color: var(--muted); }
.ocard { width: 100%; text-align: left; display: flex; gap: 12px; align-items: center; }
.ocard .thumbs { display: flex; flex-shrink: 0; }
.ocard .thumbs div { width: 42px; height: 42px; border-radius: 12px; overflow: hidden; border: 2px solid var(--card); background: var(--chip); margin-left: -12px; }
.ocard .thumbs div:first-child { margin-left: 0; }
.ocard .thumbs img { width: 100%; height: 100%; object-fit: cover; }
.ocard .ob { flex: 1; min-width: 0; }
.empty { text-align: center; padding: 60px 16px; color: var(--muted); font-size: 0.92rem; font-weight: 600; }
.empty .big { font-size: 3rem; margin-bottom: 10px; }
.empty .btn { display: inline-flex; margin-top: 16px; padding: 12px 22px; }
.skeleton { background: linear-gradient(90deg, var(--chip) 25%, var(--line) 50%, var(--chip) 75%); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: var(--r-md); }
@keyframes sk { to { background-position: -200% 0; } }

/* ---------- bottom nav / action bar ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: 0 12px calc(10px + var(--sb)); pointer-events: none; }
.nav-in { pointer-events: auto; max-width: 536px; margin: 0 auto; background: var(--card); border-radius: 26px; box-shadow: 0 -2px 30px rgba(60,35,20,.12); display: flex; align-items: flex-end; justify-content: space-around; padding: 8px 6px 8px; }
.nav-it { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.66rem; font-weight: 700; color: var(--muted); padding: 4px 0; }
.nav-it svg { width: 23px; height: 23px; }
.nav-it.on { color: var(--primary); }
.nav-it.on .nav-ic { background: var(--primary); color: #fff; }
.nav-ic { width: 40px; height: 32px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.nav-cart { flex: 1; display: flex; flex-direction: column; align-items: center; font-size: 0.66rem; font-weight: 800; color: var(--text); }
.nav-cart .fab { width: 58px; height: 58px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; margin-top: -30px; margin-bottom: 3px; box-shadow: 0 8px 18px rgba(228,87,46,.45); border: 4px solid var(--bg); position: relative; }
.nav-cart .fab svg { width: 24px; height: 24px; }
.nav-cart .cnt[hidden] { display: none; }
.nav-cart .cnt { position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--text); color: var(--bg); font-size: 0.72rem; font-weight: 900; display: flex; align-items: center; justify-content: center; }
.action { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: 12px 16px calc(12px + var(--sb)); background: linear-gradient(to top, var(--bg) 75%, rgba(0,0,0,0)); display: none; }
.action.show { display: block; }

/* reveal animation */

.ch-rv.in { opacity: 1; transform: none; }

/* hero */
.ch-hero { position: relative; margin: 0 -16px 10px; padding: 18px 16px 30px; overflow: hidden; }
.ch-hero-card { position: relative; z-index: 2; display: grid; grid-template-columns: 34% 1fr; min-height: 184px; border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
.ch-hero-side { background: #f6f4ec; color: #2a2f31; padding: 16px 12px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }

.ch-hero-main { position: relative; background: #1d2224; padding: 16px 14px; }

.ch-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--olive); color: var(--olive-2); font-weight: 800; font-size: .76rem; letter-spacing: .06em; text-transform: uppercase; transition: background .25s, color .25s, transform .2s; }

.ch-fan { position: absolute; right: -18px; top: 50%; width: 58%; aspect-ratio: 1.15; transform: translateY(-50%); z-index: 3; pointer-events: none; }
.ch-fan::before { content: ''; position: absolute; inset: 6% 0 4% 12%; background: linear-gradient(140deg, #f3e8b2, #e7d98c); clip-path: polygon(0 18%, 100% 0, 100% 100%, 0 82%); border-radius: 8px; opacity: .95; }
.ch-fan img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 18px 18px rgba(0,0,0,.45)); animation: ch-bob 6s ease-in-out infinite; }
@keyframes ch-bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
.ch-float { position: absolute; z-index: 4; pointer-events: none; will-change: transform; }

.ch-float svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 8px 10px rgba(0,0,0,.35)); }
@keyframes ch-drift { 0%, 100% { transform: translate(0, 0) rotate(0); } 33% { transform: translate(6px, -10px) rotate(14deg); } 66% { transform: translate(-5px, 5px) rotate(-10deg); } }

/* section heads */

.ch-chef.in .ch-chef-pic img { animation: ch-spin-in 1.4s cubic-bezier(.16,1,.3,1); }
@keyframes ch-spin-in { from { transform: rotate(-70deg) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.ch-chef-card { position: relative; z-index: 2; margin-left: -10px; background: #1d2224; border: 1.5px solid rgba(255,255,255,.12); padding: 14px 12px; text-align: center; box-shadow: var(--shadow); }

.ch-chef-card b { display: block; font-family: var(--chalk); font-size: 1.9rem; line-height: .95; color: #fff; margin: 6px 0; letter-spacing: .04em; }
.ch-chef-card small { display: block; font-size: .68rem; color: #c3c7bf; line-height: 1.35; }
.ch-chef-card .ft { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }

/* offers of the day */
.ch-offers { display: grid; grid-auto-flow: column; grid-auto-columns: 44%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 56px 16px 6px; margin: 0 -16px; }
.ch-offer { scroll-snap-align: start; position: relative; background: #1d2224; border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 66px 10px 12px; text-align: center; transition: transform .3s cubic-bezier(.16,1,.3,1); }
.ch-offer:active { transform: translateY(-4px) scale(.98); }
.ch-offer .ph { position: absolute; left: 50%; top: -46px; width: 112%; aspect-ratio: 1.35; transform: translateX(-50%); }
.ch-offer .ph img, .ch-offer .ph .emo { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 14px 14px rgba(0,0,0,.5)); transition: transform .6s cubic-bezier(.16,1,.3,1); }
.ch-offer .ph .emo { display: grid; place-items: center; font-size: 3rem; }
.ch-offer:active .ph img { transform: rotate(-8deg) scale(1.06); }
.ch-offer b { display: block; font-family: var(--chalk); font-size: 1.55rem; line-height: .95; color: #fff; letter-spacing: .04em; min-height: 2em; display: flex; align-items: center; justify-content: center; }
.ch-offer small { display: block; font-size: .62rem; color: var(--muted); line-height: 1.3; margin-top: 4px; min-height: 2.6em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ch-offer .ft { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; min-height: 34px; }
.ch-pill { display: inline-flex; padding: 7px 14px; border-radius: 999px; background: var(--olive); color: var(--ink); font-weight: 800; font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; }
.ch-pill.ghost { background: transparent; border: 1px solid rgba(255,255,255,.2); color: var(--muted); }

/* tabs + grid */
.ch-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px 4px; margin: 0 -16px; scrollbar-width: none; position: relative; }
.ch-tabs::-webkit-scrollbar { display: none; }
.ch-tab { flex: none; padding: 9px 16px; border-radius: 999px; font-weight: 700; font-size: .8rem; color: var(--text); background: rgba(255,255,255,.05); border: 1.5px solid rgba(255,255,255,.14); transition: background .3s, color .3s, border-color .3s, transform .2s; }
.ch-tab:active { transform: scale(.94); }
.ch-tab.on { background: var(--olive); border-color: var(--olive); color: var(--ink); }
.ch-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.ch-grid .pcard { animation: ch-pop .55s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes ch-pop { from { opacity: 0; transform: translateY(18px) scale(.95); } to { opacity: 1; transform: none; } }
.ch-more { display: block; width: 100%; margin-top: 14px; padding: 13px; border-radius: 999px; border: 1.5px dashed rgba(228,234,176,.5); color: var(--olive-2); font-weight: 800; font-size: .84rem; }

/* hot promos (chalk icons) */
.ch-promos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; text-align: center; }
.ch-promo svg { width: 54px; height: 54px; margin: 0 auto 6px; display: block; }
.ch-promo svg * { stroke-dasharray: 300; stroke-dashoffset: 300; transition: stroke-dashoffset 1.6s ease var(--d, 0s); }
.ch-promo.in svg * { stroke-dashoffset: 0; }
.ch-promo b { display: block; font-family: var(--chalk); font-size: 1.35rem; letter-spacing: .06em; line-height: 1; color: #fff; }
.ch-promo span { display: block; font-family: var(--chalk); font-size: 1.05rem; color: #cfd2c9; line-height: 1.05; margin-top: 4px; }

/* contact banner */
.ch-contact { position: relative; margin: 28px -16px 0; padding: 22px 18px 26px; background: #1a1e20; clip-path: polygon(0 10%, 100% 0, 100% 100%, 3% 92%); text-align: center; }
.ch-contact .ch-h { font-size: 2rem; }
.ch-contact p { color: var(--olive-2); font-family: var(--chalk); font-size: 1.35rem; letter-spacing: .04em; margin-top: 8px; }
.ch-contact .row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.ch-contact a { text-decoration: none; }

/* fly-to-cart */
.ch-fly { position: fixed; z-index: 200; width: 54px; height: 54px; border-radius: 50%; pointer-events: none; background: center/contain no-repeat; filter: drop-shadow(0 8px 10px rgba(0,0,0,.4)); }

@media (prefers-reduced-motion: reduce) {
  .ch-rv { opacity: 1; transform: none; transition: none; }
  .ch-fan img, .ch-float > i, .ch-grid .pcard { animation: none !important; }
  .ch-promo svg * { stroke-dashoffset: 0; transition: none; }
}

/* photos: real cut-outs float, ordinary photos get a rounded frame */

/* hero: text on top, dish on the fan in the lower right */

.ch-fan { top: auto; bottom: 8px; transform: none; width: 46%; right: -10px; }

.ch-hero-main { padding-bottom: 86px; }

/* ================= skin: market (ui.skin = "market") — clean store layout, smooth motion ================= */
html[data-skin="market"] {
  --mk: #1d4fa0; --mk-d: #143a7a; --mk-soft: #eaf1fb; --mk-sun: #f5b301; --mk-sun-soft: #fff4d6;
  --primary: var(--mk); --primary-dark: var(--mk-d); --primary-soft: var(--mk-soft); --green: var(--mk);
  --bg: #f4f7fb; --card: #ffffff; --text: #14213d; --muted: #6b7690; --line: #e6ebf3; --chip: #eef2f8;
  --shadow: 0 10px 30px rgba(20,33,61,.08); --shadow-sm: 0 3px 12px rgba(20,33,61,.06);
  --ease: cubic-bezier(.16,1,.3,1); --spring: cubic-bezier(.34,1.56,.64,1);
}
html[data-skin="market"] body { background: var(--bg); }

html[data-skin="market"] #screen-home > .sec-head, html[data-skin="market"] #popular, html[data-skin="market"] #info,
html[data-skin="market"] #screen-home > .addr, html[data-skin="market"] #screen-home > .topbar { display: none !important; }
html[data-skin="market"] .mk { display: block; }
.mk { display: none; }
html[data-skin="market"] #screen-home { padding-top: 0; }
html[data-skin="market"] .screen.active { animation: mk-scr .45s var(--ease); }
@keyframes mk-scr { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* reveal on scroll */
.mk-rv { opacity: 0; transform: translateY(22px); transition: opacity .6s var(--ease), transform .6s var(--ease); transition-delay: var(--d, 0s); }
.mk-rv.in { opacity: 1; transform: none; }

/* strip + header */
.mk-strip { margin: 0 -16px; background: var(--mk-d); color: #dfe8f7; font-size: .7rem; font-weight: 600; overflow: hidden; white-space: nowrap; }
.mk-strip-in { display: inline-flex; gap: 28px; padding: 8px 0; animation: mk-marq 26s linear infinite; }
.mk-strip-in span { display: inline-flex; align-items: center; gap: 6px; }
.mk-strip-in svg { width: 13px; height: 13px; flex: none; }
@keyframes mk-marq { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.mk-head { display: flex; align-items: center; gap: 10px; padding: 14px 0 12px; }
.mk-logo { width: 46px; height: 46px; border-radius: 14px; background: var(--mk); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 1.3rem; flex: none; overflow: hidden; box-shadow: 0 8px 18px rgba(29,79,160,.28); }
.mk-logo img { width: 100%; height: 100%; object-fit: cover; }
.mk-brand { flex: 1; min-width: 0; }
.mk-brand b { display: block; font-size: 1.12rem; font-weight: 900; letter-spacing: -.3px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.mk-ib { position: relative; width: 44px; height: 44px; border-radius: 14px; background: #fff; box-shadow: var(--shadow-sm); display: grid; place-items: center; color: var(--text); flex: none; text-decoration: none; transition: transform .2s var(--spring); }

@keyframes mk-pop { 0% { transform: scale(.4); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }

/* search */
.mk-search { display: flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid var(--line); border-radius: 16px; padding: 5px 5px 5px 14px; box-shadow: var(--shadow-sm); width: 100%; text-align: left; transition: border-color .25s, box-shadow .25s; }

/* hero */
.mk-hero { position: relative; margin: 16px 0 0; border-radius: 24px; overflow: hidden; background: linear-gradient(135deg, #ffffff 0%, var(--mk-soft) 100%); box-shadow: var(--shadow); padding: 20px 18px 18px; min-height: 238px; }
.mk-hero::before { content: ''; position: absolute; width: 230px; height: 230px; right: -70px; top: -50px; border-radius: 50%; background: radial-gradient(circle, rgba(29,79,160,.16), rgba(29,79,160,0) 70%); }

.mk-eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: .64rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--mk); }

.mk-btns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.mk-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 16px; border-radius: 12px; font-size: .82rem; font-weight: 800; text-decoration: none; transition: transform .2s var(--spring), box-shadow .25s, background .25s; }
.mk-btn:active { transform: scale(.94); }
.mk-btn.solid { background: var(--mk); color: #fff; box-shadow: 0 8px 18px rgba(29,79,160,.3); }
.mk-btn.line { background: #fff; color: var(--mk); border: 1.5px solid var(--mk); }
.mk-btn .ar { transition: transform .25s var(--ease); }
.mk-btn:hover .ar { transform: translateX(3px); }
.mk-hero-pic { position: absolute; right: -24px; bottom: -6px; width: 56%; aspect-ratio: 1; z-index: 1; animation: mk-float 6s ease-in-out infinite; }
.mk-hero-pic img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; box-shadow: 0 22px 40px rgba(20,33,61,.25); animation: mk-in-pic 1s var(--ease) both; }
.mk-hero-pic.cut img { object-fit: contain; border-radius: 0; box-shadow: none; filter: drop-shadow(0 22px 22px rgba(20,33,61,.3)); }
@keyframes mk-float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-8px) rotate(3deg); } }
@keyframes mk-in-pic { from { opacity: 0; transform: translateX(30px) rotate(40deg) scale(.7); } to { opacity: 1; transform: none; } }
.mk-badge { position: absolute; z-index: 3; right: 14px; top: 14px; width: 66px; height: 66px; border-radius: 50%; background: var(--mk-sun); color: var(--text); display: grid; place-items: center; text-align: center; font-weight: 900; line-height: 1.05; box-shadow: 0 8px 18px rgba(245,179,1,.4); animation: mk-badge 3.2s ease-in-out infinite; }

/* promo duo */
.mk-duo { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; margin-top: 22px; }
.mk-big { position: relative; overflow: hidden; border-radius: 22px; background: linear-gradient(135deg, var(--mk-d), var(--mk)); color: #fff; padding: 16px 14px; min-height: 176px; text-align: left; }

.mk-big h3 em { display: block; font-style: normal; color: var(--mk-sun); }

.mk-big img { position: absolute; right: -26px; bottom: -22px; width: 62%; aspect-ratio: 1; object-fit: cover; border-radius: 50%; border: 4px solid rgba(255,255,255,.18); transition: transform .8s var(--ease); }
.mk-big:active img { transform: scale(1.06) rotate(-6deg); }
.mk-big .pr { position: absolute; z-index: 3; right: 10px; top: 10px; background: var(--mk-sun); color: var(--text); border-radius: 50%; width: 52px; height: 52px; display: grid; place-items: center; text-align: center; font-size: .62rem; font-weight: 900; line-height: 1.05; animation: mk-badge 3.2s ease-in-out infinite; }
.mk-small { position: relative; overflow: hidden; border-radius: 22px; background: #fff; box-shadow: var(--shadow-sm); padding: 14px 12px; display: flex; flex-direction: column; text-align: left; }

.mk-small svg { width: 74px; height: 56px; margin: auto 0 0 auto; }
.mk-scoot { animation: mk-ride 2.6s ease-in-out infinite; }
@keyframes mk-ride { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-6px); } }

/* deal cards */
.mk-row { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 10px; scroll-snap-type: x proximity; }
.mk-card { flex: 0 0 150px; scroll-snap-align: start; position: relative; background: #fff; border-radius: 18px; box-shadow: var(--shadow-sm); padding: 8px; display: flex; flex-direction: column; text-align: left; transition: transform .3s var(--ease), box-shadow .3s; }

@keyframes mk-skel { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes mk-fade { from { opacity: 0; } to { opacity: 1; } }
.mk-tag { position: absolute; z-index: 2; top: 7px; left: 7px; background: var(--mk); color: #fff; font-size: .58rem; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; padding: 4px 7px; border-radius: 7px; }

/* add-to-cart control (market) */
.mk-add { width: 100%; margin-top: 8px; min-height: 36px; border-radius: 11px; border: 1.5px solid var(--mk); color: var(--mk); background: #fff; font-size: .74rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background .25s, color .25s, transform .2s var(--spring); }

/* why us */

.mk-why div { display: flex; gap: 10px; align-items: flex-start; background: #fff; border-radius: 16px; padding: 12px; box-shadow: var(--shadow-sm); }

html[data-skin="market"] .pcard { border-radius: 18px; padding: 8px; transition: transform .3s var(--ease), box-shadow .3s; animation: mk-up .5s var(--ease) both; }
html[data-skin="market"] .pcard:active { transform: scale(.97); }
html[data-skin="market"] .pcard-img { border-radius: 13px; background: linear-gradient(100deg, #eef2f8 30%, #f8fafd 50%, #eef2f8 70%); background-size: 300% 100%; animation: mk-skel 1.4s linear infinite; }
html[data-skin="market"] .pcard-img img { animation: mk-fade .5s ease both; transition: transform .6s var(--ease); }

  if (!lastOrder) return; let added = 0, miss = [];
  lastOrder.items.forEach(x => { const it = itemsByName[x.name]; if (it && it.is_available) { cart[it.id] = Math.min((cart[it.id] || 0) + x.qty, 50); added++; } else miss.push(x.name); });
  store.set(LS_CART, cart); Object.keys(cart).forEach(refreshCtl);
  if (added) { openCart(); if (miss.length) toast('Нет в наличии: ' + miss.join(', ')); } else toast('Этих блюд сейчас нет в наличии');
}

// ---------- orders ----------
async function loadOrders() {
  if (!myOrders.length) { $('orders').innerHTML = '<div class="empty"><div class="big">🧾</div>Здесь появятся ваши заказы<br><button class="btn primary" onclick="nav(\'menu\')">Выбрать блюда</button></div>'; return; }
  $('orders').innerHTML = '<div class="skeleton" style="height:74px;margin-bottom:12px"></div><div class="skeleton" style="height:74px"></div>';
  try {
    const arr = await rpc('cafe_public_get_orders', { p_tokens: myOrders.slice(0, 30) });
    if (!arr.length) { $('orders').innerHTML = '<div class="empty"><div class="big">🧾</div>Здесь появятся ваши заказы</div>'; return; }
    $('orders').innerHTML = arr.map(o => '<button class="card ocard" onclick="openStatus(\'' + o.public_token + '\')"><span class="thumbs">' +
      o.items.slice(0, 3).map(x => '<div>' + imgOr(itemsByName[x.name]) + '</div>').join('') + '</span><span class="ob"><span style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>№' + o.number + '</b><span class="badge ' + (o.status === 'done' ? 'done' : o.status === 'cancelled' ? 'cancelled' : '') + '">' + esc(LABELS[o.status]) + '</span></span>' +
      '<span class="m" style="display:block;font-size:.78rem;color:var(--muted);font-weight:600;margin-top:3px">' + new Date(o.created_at).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + ' · ' + o.items.reduce((a, i) => a + i.qty, 0) + ' поз. · <b style="color:var(--text)">' + money(o.total) + '</b></span></span></button>').join('');
  } catch (e) { $('orders').innerHTML = '<div class="empty">Не удалось загрузить заказы</div>'; }
}

// ---------- profile ----------
function fillProfile() {
  renderRef();
  $('p-name').value = profile.name || (tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') : '');
  $('p-phone').value = profile.phone || ''; $('p-address').value = profile.address || ''; $('p-note').value = profile.note || '';
  if (venue) $('venue-info').innerHTML = '<div class="card-title">📍 ' + esc(venue.name) + '</div>' +
    (venue.address ? '<div class="srow"><span class="m">Адрес</span><span style="text-align:right;max-width:65%">' + esc(venue.address) + '</span></div>' : '') +
    (venue.map_url ? '<a class="btn ghost" style="margin:8px 0 4px" href="' + esc(venue.map_url) + '" target="_blank" rel="noopener">🗺 Открыть на карте</a>' : '') +
    (venue.work_hours ? '<div class="srow"><span class="m">Часы работы</span><span>' + esc(venue.work_hours) + (venue.open_now === false ? ' · <b style="color:var(--primary)">сейчас закрыто</b>' : '') + '</span></div>' : '') +
    (venue.support_contact ? '<div class="srow"><span class="m">Вопросы</span><a href="' + esc(supLink(venue.support_contact)) + '" target="_blank" rel="noopener" style="color:var(--primary);font-weight:800;text-decoration:none">' + esc(supText(venue.support_contact)) + '</a></div>' : '') +
    (venue.phone ? '<div class="srow"><span class="m">Телефон</span><a href="tel:' + esc(venue.phone.replace(/[^0-9+]/g, '')) + '" style="color:var(--primary);font-weight:800;text-decoration:none">' + esc(venue.phone) + '</a></div>' : '');
}
function saveProfile() {
  profile = { name: $('p-name').value.trim(), phone: $('p-phone').value.trim(), address: $('p-address').value.trim(), note: $('p-note').value.trim() };
  store.set(LS_PROFILE, profile);
  ['name', 'phone', 'address', 'note'].forEach(k => { $('f-' + k).value = profile[k] || ''; });
  $('addr-val').textContent = profile.address || 'Указать адрес ›';
  haptic('medium'); toast('Сохранено');
}

// ---------- init ----------
loadCloud();
loadMenu().then(() => {
  const m = startParam.match(/order_([a-f0-9]{32})/) || [null, qs.get('order')];
  if (m[1]) openStatus(m[1], false);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && current === 'status' && currentToken) loadStatus(false); });
document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a[target="_blank"]'); if (a && tg && tg.openLink) { e.preventDefault(); tg.openLink(a.href); } });
// swipe the item card down to close it
(function () {
  const sh = $('sheet'), back = $('sheet-back');
  let y0 = 0, dy = 0, t0 = 0, drag = false, armed = false;
  sh.addEventListener('touchstart', e => {
    if (!sheetOpen || e.touches.length !== 1) return;
    armed = sh.scrollTop <= 0; drag = false; dy = 0; y0 = e.touches[0].clientY; t0 = Date.now();
  }, { passive: true });
  sh.addEventListener('touchmove', e => {
    if (!armed) return;
    const d = e.touches[0].clientY - y0;
    if (!drag) { if (d > 6 && sh.scrollTop <= 0) { drag = true; sh.style.transition = 'none'; } else if (d < -6) { armed = false; return; } else return; }
    dy = Math.max(0, d);
    sh.style.transform = 'translateY(' + dy + 'px)';
    back.style.opacity = String(Math.max(0, 1 - dy / 400));
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
  const end = () => {
    if (!drag) { armed = false; return; }
    drag = armed = false; back.style.opacity = '';
    const fast = dy > 40 && dy / Math.max(1, Date.now() - t0) > 0.5;
    if (dy > 110 || fast) { sh.style.transition = ''; haptic('light'); closeSheet(); }
    else { sh.style.transition = ''; sh.style.transform = ''; }
  };
  sh.addEventListener('touchend', end); sh.addEventListener('touchcancel', end);
})();
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOpen) closeSheet(); });
</script>
