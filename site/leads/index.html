const STATUSES = [['new', 'Новый'], ['contacted', 'Написал'], ['talks', 'Переговоры'], ['client', 'Клиент'], ['rejected', 'Отказ']];

const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY || new URLSearchParams(location.search).has('demo');

const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let token = new URLSearchParams(location.search).get('t') || store.get('gm_token');
if (token) store.set('gm_token', token);

let summary = null;
const cache = {};
const ui = { view: 'new', q: '', status: '', auCity: '', auSort: 'ru', feedCity: '', feedDays: '7' };
// «новое для вас»: всё, что найдено после прошлого визита на страницу «Новые находки»
const prevVisit = Number(store.get('gm_feed_visit') || 0);
let feedVisitSaved = false;

// ---------- API ----------
async function rpc(fn, args) {
  if (DEMO) return demoRpc(fn, args);
  const res = await fetch(`${CONFIG.SUPABASE_URL.replace(/\/+$/, '')}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: CONFIG.SUPABASE_ANON_KEY, Authorization: `Bearer ${CONFIG.SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_token: token, ...args }),
  });
  if (res.status === 401 || res.status === 403) { store.set('gm_token', ''); token = null; throw new Error('forbidden'); }
  if (!res.ok) throw new Error(await res.text());
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}

// ---------- helpers ----------
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  block_ads: '📈 Реклама. Если нужен быстрый поток {audience} — настраиваем и ведём рекламу в поиске и на картах Google и Яндекса.',

  signature: '—\nАндрей, «Ваш Рост»\nTelegram: @izmaylov_th',
  en_intro: 'Hello! My name is Andrei, «Vash Rost» agency — we help businesses in Asia get clients from Google Maps and Yandex Maps, especially Russian-speaking ones.',
  en_med_hook: 'I looked at {name} on Google Maps: {ru_reviews} of the last {sampled} reviews are in Russian. Russian-speaking patients already come to you — but most of them search for a doctor on Yandex Maps and in Russian on Google, where clinics in {city_en} are barely visible. Those patients go to whoever they find first.',
  en_block_site: '🌐 Website. Your Google Maps profile has no website — for Google that lowers trust. Profiles linked to their own website rank higher than competitors without one. We build websites and connect them to Google Maps, examples:\nhttps://oasis-pattaya.com\nhttps://iconic-cafe.uz',
  en_block_maps: '📍 Maps. We take over Google Maps and Yandex Maps: profile optimisation for patients\' search queries, posts and offers, SEO replies to reviews, disputing fake negative reviews — in Russian and English.',
  en_block_ads: '📈 Ads. For a fast flow of patients we set up and run search and maps ads on Google and Yandex.',
  en_cta: 'I can do a free audit of the {name} profile and send you what is holding it back and what to fix first. Shall I send it?',
  en_signature: '—\nAndrei, «Vash Rost»\nTelegram: @izmaylov_th',
};
const TEMPLATE_GROUPS = [
  ['Начало и конец', { intro: 'Приветствие — кто мы', cta: 'Призыв в конце', signature: 'Подпись' }],
  ['Заведения — первая фраза (выбирается автоматически)', {
    food_hook_fresh: '🔥 Только открылись (≤5 отзывов)', food_hook_small: 'Работают, но отзывов втрое меньше, чем у пятёрки лидеров города',
    food_hook_existing: 'Крупные, заметные места' }],
  ['Клиники — первая фраза', { med_hook: 'Есть русские отзывы' }],
  ['Недвижимость, аренда, турагентства — первая фраза', { realty_hook: '🏠 Агентства недвижимости', rental_hook: '🛵 Аренда байков и авто', travel_hook: '🧭 Турагентства' }],
  ['Блоки «проблема → решение» (включаются галочками у каждого сообщения)', {
    block_bot: '🛵 Telegram-бот с доставкой (только заведения)', block_site: '🌐 Сайт (по умолчанию — если у места нет сайта)',
    block_maps: '📍 Обслуживание Google и Яндекс Карт', block_ads: '📈 Реклама в Google и Яндексе' }],
  ['Клиники — английская версия', { en_intro: 'Приветствие', en_med_hook: 'Первая фраза', en_block_site: 'Сайт', en_block_maps: 'Карты', en_block_ads: 'Реклама', en_cta: 'Призыв', en_signature: 'Подпись' }],
];
let settings = {};
const tpl = (k) => settings.templates?.[k] ?? DEFAULT_TEMPLATES[k];

const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; };

/** Отзывы у 5-го по величине СНГ-заведения города: «у пятёрки лидеров — от N отзывов». */
function topReviews(r) {
  const seen = new Map();
  for (const rows of Object.values(cache)) for (const x of rows)
    if (x.vertical === 'food' && x.city === r.city && x.place_id !== r.place_id && x.segment === 'cis') seen.set(x.place_id, x.reviews || 0);
  const sorted = [...seen.values()].sort((a, b) => b - a);
  const fifth = sorted[Math.min(4, sorted.length - 1)] || 0;
  return fifth >= 100 ? Math.floor(fifth / 100) * 100 : fifth;
}

function vars(r) {
  const c = cityBy(r.city), n = r.reviews ?? 0;
  return { name: r.name || '', city: c?.name || '', city_in: CITY_IN[r.city] || '', city_en: CITY_EN[r.city] || '',
    cuisine: r.type_label || '', rating: r.rating ?? '—', reviews: n, top_reviews: topReviews(r).toLocaleString('ru-RU'),
    rating_phrase: r.rating == null ? 'карточка уже есть'
      : r.rating >= 4.5 ? `${r.rating}★, ${r.vertical === 'food' ? 'гостям' : 'клиентам'} у вас явно нравится`
      : r.rating >= 4.0 ? `рейтинг ${r.rating}★`
      : `рейтинг ${r.rating}★, и его можно поднять грамотной работой с отзывами`,
    reviews_text: n ? `${n.toLocaleString('ru-RU')} ${plural(n, 'отзыв', 'отзыва', 'отзывов')}` : 'пока нет отзывов',
    ru_reviews: r.ru_reviews ?? 0, sampled: r.reviews_sampled ?? 0, local_lang: LOCAL_LANG[c?.country] || 'местном языке',
    audience: { food: 'туристов', medical: 'пациентов', realty: 'клиентов', rental: 'туристов', travel: 'туристов' }[r.vertical] || 'клиентов' };
}
const fillTemplate = (text, r) => { const v = vars(r); return text.replace(/\{(\w+)\}/g, (m, k) => (k in v ? String(v[k]) : m)); };

const BLOCKS = [['bot', '🛵 Бот'], ['site', '🌐 Сайт'], ['maps', '📍 Карты'], ['ads', '📈 Реклама']];
function defaultBlocks(r) {
  const food = r.vertical === 'food';
  return { bot: food, site: !r.website, maps: true, ads: !food };
}

function hookKey(r) {
  if (r.vertical === 'realty') return 'realty_hook';
  if (r.vertical === 'rental') return 'rental_hook';
  if (r.vertical === 'travel') return 'travel_hook';
  if (r.vertical !== 'food') return 'med_hook';
  if (!r.is_baseline && (r.reviews ?? 0) <= FRESH_MAX) return 'food_hook_fresh';
  const top = topReviews(r);
  if ((r.reviews ?? 0) <= FRESH_MAX) return 'food_hook_fresh';
  return top && (r.reviews ?? 0) * 3 < top ? 'food_hook_small' : 'food_hook_existing';
}

function buildMessage(r, lang = 'ru', blocks = defaultBlocks(r)) {
  const en = lang === 'en' && r.vertical === 'medical';
  const k = (key) => (en ? `en_${key}` : key);
  const parts = [tpl(k('intro')), tpl(en ? 'en_med_hook' : hookKey(r))];
  for (const [b] of BLOCKS) if (blocks[b] && !(b === 'bot' && (r.vertical !== 'food' || en))) parts.push(tpl(k(`block_${b}`)));
  parts.push(tpl(k('cta')), tpl(k('signature')));
  return fillTemplate(parts.filter(Boolean).join('\n\n'), r);
}

const CHANNEL_LABEL = { whatsapp: 'WhatsApp', zalo: 'Zalo', copy: 'скопировано', call: 'звонок' };

function contacts(r, country) {
  const out = [];
  const digits = (r.phone_intl || '').replace(/\D/g, '');
  if (r.phone_intl) out.push(`<a href="tel:+${digits}">📞 ${esc(r.phone_intl)}</a>`);
  if (digits) out.push(`<a href="https://wa.me/${digits}" target="_blank">WhatsApp</a>`);
  if (digits && country === 'VN') out.push(`<a href="https://zalo.me/${digits}" target="_blank">Zalo</a>`);
  if (r.website) out.push(`<a href="${esc(r.website)}" target="_blank">🌐 Сайт</a>`);
  out.push(`<a href="${esc(mapsLink(r))}" target="_blank">🗺 Карта</a>`);
  return out.join('');
}

function cardHtml(r, opts = {}) {
  const c = cityBy(r.city);
  const fresh = r.vertical === 'food' && !r.is_baseline && (r.reviews ?? 0) <= FRESH_MAX;
  const tags = [];
  if (r.segment === 'cis') tags.push('<span class="tag t-cis">СНГ</span>');
  if (r.segment === 'maybe') tags.push('<span class="tag t-maybe">возможно</span>');
  if (r.segment === 'cis' && r.vertical !== 'food') tags.splice(tags.indexOf('<span class="tag t-cis">СНГ</span>'), 1, '<span class="tag t-ru">🇷🇺 русскоязычная</span>');
  if (r.segment === 'ru_audience') tags.push(`<span class="tag t-ru">🇷🇺 ${r.ru_reviews}/${r.reviews_sampled} отзывов</span>`);
  if (fresh) tags.push('<span class="tag t-fresh">🔥 только открылись</span>');
  if (!r.website) tags.push('<span class="tag t-nosite">без сайта</span>');
  if (r.business_status === 'CLOSED_PERMANENTLY') tags.push('<span class="tag t-closed">закрыто</span>');
  if (opts.unseen) tags.unshift('<span class="tag t-unseen">● новое для вас</span>');
  return `<div class="card${opts.unseen ? ' unseen' : ''}" data-id="${esc(r.place_id)}">
    <div>
      <h3><a href="${esc(mapsLink(r))}" target="_blank">${esc(r.name || 'Без названия')}</a>${tags.join('')}</h3>
      <div class="meta">
        ${r.type_label ? `<span>${esc(r.type_label)}</span>` : ''}
        <span>⭐ ${r.rating ?? '—'} · ${r.reviews ?? 0} отзывов</span>
        ${opts.showCity && c ? `<span>📍 ${esc(c.name)}</span>` : ''}
        ${r.address ? `<span>${esc(r.address)}</span>` : ''}
      </div>
      ${r.segment_reason ? `<div class="why"><b>Почему:</b> ${esc(r.segment_reason)}</div>` : ''}
      <div class="contacts">${contacts(r, c?.country)}</div>
      <div class="outreach" hidden></div>
    </div>
    <div class="side">
      ${r.phone_intl ? `<button class="btn write${r.outreach_at ? ' done' : ''}" data-act="write">${r.outreach_at
        ? `✓ Написал ${fmtDate(r.outreach_at)}${r.outreach_channel ? ' · ' + esc(CHANNEL_LABEL[r.outreach_channel] || r.outreach_channel) : ''}`
        : '✉️ Написать'}</button>` : '<div class="nophone">нет телефона — только через сайт/карту</div>'}
      <select data-f="status">${STATUSES.map(([v, l]) => `<option value="${v}"${r.lead_status === v ? ' selected' : ''}>${l}</option>`).join('')}</select>
      <input data-f="notes" placeholder="Заметка…" value="${esc(r.notes || '')}">
      <div class="saved"></div>
      <div class="date">${r.is_baseline ? 'было на карте до старта' : 'найдено ' + fmtDate(r.first_seen)}</div>
    </div>
  </div>`;
}

function applyFilters(rows) {
  const q = ui.q.trim().toLowerCase();
  return rows.filter((r) => (!ui.status || r.lead_status === ui.status)
    && (!q || [r.name, r.address, r.type_label, r.segment_reason, r.notes].join(' ').toLowerCase().includes(q)));
}

function toolbar(extra = '') {
  return `<div class="bar">${extra}
    <input type="search" id="q" placeholder="Поиск по названию, адресу, заметкам" value="${esc(ui.q)}">
    <select id="st"><option value="">Все статусы</option>${STATUSES.map(([v, l]) => `<option value="${v}"${ui.status === v ? ' selected' : ''}>${l}</option>`).join('')}</select>
    <button class="btn" id="csv">⬇ CSV</button></div>`;
}

// ---------- страницы ----------
async function load(key, fn) { return cache[key] ??= await fn(); }

async function cityPage(slug) {
  const c = cityBy(slug);
  if (!c) return renderEmpty('Город не найден');
  const rows = await load(`food:${slug}`, () => rpc('gm_dashboard', { p_vertical: 'food', p_city: slug }));
  const views = {
    new: rows.filter((r) => !r.is_baseline),
    all: rows.filter((r) => r.segment === 'cis'),
    maybe: rows.filter((r) => r.segment === 'maybe'),

  if (ui.view === 'new' && !views.new.length && !ui.viewChosen) ui.view = 'all';   // новых пока нет — показываем всех
  const shown = applyFilters(views[ui.view]);
  const segBtn = (v, l) => `<button data-view="${v}" class="${ui.view === v ? 'on' : ''}">${l} · ${views[v].length}</button>`;
  app.innerHTML = `
    <h1>${esc(c.name)}</h1>
    <div class="sub">Русская, украинская, узбекская, кавказская и восточная кухня · обновлено ${ago(c.last_run)}${c.baseline_left > 0 ? ` · идёт набор базы, уведомления начнутся через ${c.baseline_left} прогон(а)` : ''}</div>
    <div class="stats">
      <div class="stat"><b>${views.new.filter((r) => Date.now() - Date.parse(r.first_seen) < 7 * 864e5).length}</b><small>новых за 7 дней</small></div>
      <div class="stat"><b>${views.new.length}</b><small>новых с начала мониторинга</small></div>
      <div class="stat"><b>${views.all.length}</b><small>всего СНГ-заведений</small></div>
      <div class="stat"><b>${rows.filter((r) => r.lead_status === 'client').length}</b><small>стали клиентами</small></div>
    </div>
    ${toolbar(`<div class="seg">${segBtn('new', 'Новые')}${segBtn('all', 'Все СНГ')}${segBtn('maybe', 'Возможно')}</div>`)}
    <div class="list">${shown.length ? shown.map((r) => cardHtml(r)).join('') : emptyText()}</div>`;

    <div class="bar"><div class="seg"><button data-auseg="cis" class="${ui.auSeg === 'cis' ? 'on' : ''}">Русскоязычные · ${all.filter((r) => r.segment === 'cis').length}</button><button data-auseg="maybe" class="${ui.auSeg === 'maybe' ? 'on' : ''}">Возможно · ${all.filter((r) => r.segment === 'maybe').length}</button></div></div>`
    : `<h1>${a.icon} ${esc(a.name)} с русскоязычными клиентами${where}</h1>
    <div class="sub">Места, где среди отзывов Google заметная доля на русском и других языках СНГ — их клиенты русскоязычные туристы, им можно предложить продвижение. Проверяются 8 самых релевантных отзывов, поэтому «3/8» — это оценка по выборке.</div>`}

    ${toolbar(`<select id="ausort">${company ? '' : `<option value="ru"${ui.auSort === 'ru' ? ' selected' : ''}>Больше русских отзывов</option>`}<option value="reviews"${ui.auSort === 'reviews' ? ' selected' : ''}>Больше отзывов всего</option><option value="rating"${ui.auSort === 'rating' ? ' selected' : ''}>Выше рейтинг</option></select>`)}
    <div class="list">${shown.length ? shown.map((r) => cardHtml(r, { showCity: true })).join('') : emptyText(`Пока пусто — запусти <code>node scanner.mjs --audience ${key}</code>`)}</div>`;

// ---------- Новые находки: все города одной лентой ----------
function dayLabel(d) {
  const day = new Date(d); day.setHours(0, 0, 0, 0);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - day) / 864e5);
  if (diff === 0) return 'Сегодня';
  if (diff === 1) return 'Вчера';
  return day.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
}

async function feedPage() {
  const all = (await load('food:all', () => rpc('gm_dashboard', { p_vertical: 'food', p_city: null })))
    .filter((r) => !r.is_baseline);
  const days = Number(ui.feedDays);
  const inRange = all.filter((r) => !days || Date.now() - Date.parse(r.first_seen) < days * 864e5);
  const shown = applyFilters(inRange.filter((r) => !ui.feedCity || r.city === ui.feedCity))
    .sort((a, b) => Date.parse(b.first_seen) - Date.parse(a.first_seen));
  const unseenCount = inRange.filter((r) => Date.parse(r.first_seen) > prevVisit).length;
  const cities = summary.cities.filter((c) => c.active);
  const chip = (slug, name) => `<button data-feedcity="${slug}" class="${ui.feedCity === slug ? 'on' : ''}">${esc(name)} · ${inRange.filter((r) => !slug || r.city === slug).length}</button>`;
  const rangeBtn = (v, l) => `<button data-days="${v}" class="${ui.feedDays === v ? 'on' : ''}">${l}</button>`;

  let html = '', lastDay = '';
  for (const r of shown) {
    const d = dayLabel(r.first_seen);
    if (d !== lastDay) { html += `<div class="day">${esc(d)}</div>`; lastDay = d; }
    html += cardHtml(r, { showCity: true, unseen: prevVisit && Date.parse(r.first_seen) > prevVisit });
  }
  const baselineLeft = cities.filter((c) => c.baseline_left > 0);
  app.innerHTML = `
    <h1>🆕 Новые находки</h1>
    <div class="sub">Заведения СНГ-формата, которые появились в выдаче после набора базы, по всем городам${prevVisit ? ` · с прошлого визита: <b>${unseenCount}</b>` : ''}${baselineLeft.length ? ` · ещё набирают базу: ${baselineLeft.map((c) => esc(c.name)).join(', ')}` : ''}</div>
    <div class="bar"><div class="seg">${rangeBtn('1', 'Сутки')}${rangeBtn('7', '7 дней')}${rangeBtn('30', '30 дней')}${rangeBtn('0', 'Всё время')}</div></div>
    <div class="bar"><div class="seg wrap-seg">${chip('', 'Все города')}${cities.map((c) => chip(c.slug, c.name)).join('')}</div></div>
    ${toolbar()}
    <div class="list">${shown.length ? html : emptyText(baselineLeft.length === cities.length
      ? 'Идёт набор базы — первые новые заведения появятся после нескольких прогонов. Все уже существующие СНГ-заведения смотри на страницах городов, вкладка «Все СНГ».'
      : 'За выбранный период новых заведений нет')}</div>`;
  app.querySelectorAll('[data-feedcity]').forEach((b) => b.onclick = () => { ui.feedCity = b.dataset.feedcity; route(); });
  app.querySelectorAll('[data-days]').forEach((b) => b.onclick = () => { ui.feedDays = b.dataset.days; route(); });
  bind(shown, `new-${ui.feedCity || 'all'}-${ui.feedDays}d`);
  if (!feedVisitSaved) { store.set('gm_feed_visit', String(Date.now())); feedVisitSaved = true; }
}

const emptyText = (t = 'Здесь пока ничего нет') => `<div class="empty">${t}</div>`;
const renderEmpty = (t) => { app.innerHTML = emptyText(t); };

function bind(shown, csvName) {
  const rerender = () => route();
  app.querySelectorAll('[data-view]').forEach((b) => b.onclick = () => { ui.view = b.dataset.view; ui.viewChosen = true; rerender(); });
  app.querySelectorAll('[data-aucity]').forEach((b) => b.onclick = () => { ui.auCity = b.dataset.aucity; rerender(); });
  const q = app.querySelector('#q');
  q.oninput = () => { ui.q = q.value; clearTimeout(q._t); q._t = setTimeout(() => { rerender(); const n = app.querySelector('#q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  app.querySelector('#st').onchange = (e) => { ui.status = e.target.value; rerender(); };
  const so = app.querySelector('#ausort'); if (so) so.onchange = (e) => { ui.auSort = e.target.value; rerender(); };
  app.querySelector('#csv').onclick = () => downloadCsv(shown, csvName);
  app.querySelectorAll('.card').forEach((el) => {
    const save = async () => {
      const id = el.dataset.id;
      const status = el.querySelector('[data-f=status]').value, notes = el.querySelector('[data-f=notes]').value;
      const msg = el.querySelector('.saved');
      try {
        await rpc('gm_set_lead', { p_place_id: id, p_status: status, p_notes: notes });
        Object.values(cache).forEach((rows) => rows.forEach((r) => { if (r.place_id === id) { r.lead_status = status; r.notes = notes; } }));
        msg.textContent = 'сохранено ✓'; setTimeout(() => (msg.textContent = ''), 1500);
      } catch (e) { msg.textContent = 'ошибка сохранения'; }
    };
    el.querySelector('[data-f=status]').onchange = save;
    el.querySelector('[data-f=notes]').onchange = save;
    const wb = el.querySelector('[data-act=write]');
    if (wb) wb.onclick = () => toggleOutreach(el);
  });
}

function findRow(id) {
  for (const rows of Object.values(cache)) { const r = rows.find((x) => x.place_id === id); if (r) return r; }
  return null;
}

function toggleOutreach(el, lang, blocks) {
  const panel = el.querySelector('.outreach');
  const r = findRow(el.dataset.id);
  if (!r) return;
  if (!panel.hidden && !lang && !blocks) { panel.hidden = true; return; }
  const c = cityBy(r.city);
  const digits = (r.phone_intl || '').replace(/\D/g, '');
  const l = lang || panel.dataset.lang || 'ru';
  const bl = blocks || defaultBlocks(r);
  panel.dataset.lang = l;
  const avail = BLOCKS.filter(([b]) => !(b === 'bot' && r.vertical !== 'food'));
  panel.innerHTML = `
    <div class="obar">
      ${r.vertical === 'medical' ? `<div class="seg langs"><button data-lang="ru" class="${l === 'ru' ? 'on' : ''}">RU</button><button data-lang="en" class="${l === 'en' ? 'on' : ''}">EN</button></div>` : ''}
      <div class="blocks">${avail.map(([b, label]) => `<label><input type="checkbox" data-b="${b}"${bl[b] ? ' checked' : ''}> ${label}</label>`).join('')}</div>
    </div>
    <textarea rows="14">${esc(buildMessage(r, l, bl))}</textarea>
    <div class="send">
      <button class="btn send-wa" data-ch="whatsapp">Отправить в WhatsApp</button>
      ${c?.country === 'VN' ? '<button class="btn" data-ch="zalo">Скопировать и открыть Zalo</button>' : ''}
      <button class="btn" data-ch="copy">Скопировать</button>
    </div>
    <div class="hint">Галочки добавляют и убирают блоки. Текст можно поправить перед отправкой. Шаблоны блоков — на странице «⚙️ Шаблоны».</div>`;
  panel.querySelectorAll('[data-b]').forEach((x) => x.onchange = () => {
    const nb = { ...bl }; panel.querySelectorAll('[data-b]').forEach((y) => { nb[y.dataset.b] = y.checked; });
    toggleOutreach(el, l, nb);
  });
  panel.hidden = false;
  panel.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => toggleOutreach(el, b.dataset.lang, bl));
  panel.querySelectorAll('[data-ch]').forEach((b) => b.onclick = async () => {
    const text = panel.querySelector('textarea').value;
    const ch = b.dataset.ch;
    if (ch === 'whatsapp') window.open(`https://wa.me/${digits}?text=${encodeURIComponent(text)}`, '_blank');
    else {
      try { await navigator.clipboard.writeText(text); } catch { panel.querySelector('textarea').select(); document.execCommand('copy'); }
      if (ch === 'zalo') window.open(`https://zalo.me/${digits}`, '_blank');
      b.textContent = 'Скопировано ✓';
    }
    try {
      await rpc('gm_mark_outreach', { p_place_id: r.place_id, p_channel: ch });
      Object.values(cache).forEach((rows) => rows.forEach((x) => { if (x.place_id === r.place_id) {
        x.outreach_at ??= new Date().toISOString(); x.outreach_channel = ch; if (x.lead_status === 'new') x.lead_status = 'contacted'; } }));
      const wb = el.querySelector('[data-act=write]');
      wb.classList.add('done'); wb.textContent = `✓ Написал ${fmtDate(r.outreach_at)} · ${CHANNEL_LABEL[ch]}`;
      el.querySelector('[data-f=status]').value = r.lead_status;
    } catch (e) { el.querySelector('.saved').textContent = 'не удалось отметить отправку'; }
  });
}

      <div class="tplbox"><label>${esc(label)}</label>
        <textarea data-k="${k}" rows="${Math.min(9, Math.max(2, Math.ceil(tpl(k).length / 95) + (tpl(k).match(/\n/g) || []).length))}">${esc(tpl(k))}</textarea></div>`).join('')}</div>`).join('')}
    <div class="bar" style="margin-top:14px"><button class="btn primary" id="saveTpl">Сохранить</button><button class="btn" id="resetTpl">Вернуть стандартные</button><span class="saved" id="tplMsg"></span></div>`;
  app.querySelector('#saveTpl').onclick = async () => {
    const t = {}; app.querySelectorAll('textarea[data-k]').forEach((x) => { t[x.dataset.k] = x.value; });
    try { await rpc('gm_set_setting', { p_key: 'templates', p_value: t }); settings.templates = t; app.querySelector('#tplMsg').textContent = 'сохранено ✓'; }
    catch (e) { app.querySelector('#tplMsg').textContent = 'ошибка сохранения'; }
  };
  app.querySelector('#resetTpl').onclick = () => { app.querySelectorAll('textarea[data-k]').forEach((x) => { x.value = DEFAULT_TEMPLATES[x.dataset.k]; }); };
}

function downloadCsv(rows, name) {
  const cols = ['name', 'city', 'segment', 'type_label', 'rating', 'reviews', 'ru_reviews', 'phone_intl', 'website', 'address', 'maps_url', 'segment_reason', 'lead_status', 'notes', 'first_seen'];
  const cell = (v) => `"${String(Array.isArray(v) ? v.join(', ') : v ?? '').replace(/"/g, '""')}"`;
  const csv = '﻿' + [cols.join(';'), ...rows.map((r) => cols.map((c) => cell(r[c])).join(';'))].join('\n');
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), download: `leads-${name}.csv` });
  a.click();
}

// ---------- навигация ----------
function renderNav(active) {
  const cities = summary.cities.filter((c) => c.active);
  const aud = Object.entries(AUDIENCE).filter(([k, a]) => a.always || summary.audience?.[k]);
  const new7 = cities.reduce((s, c) => s + (c.new7 || 0), 0);
  const foodTotal = cities.reduce((s, c) => s + (c.cis || 0), 0);
  const foodActive = active === 'new' || cities.some((c) => c.slug === active);
  // 1-й ряд — сферы бизнеса
  const foodHref = new7 ? '#new' : `#${cities[0]?.slug || 'new'}`;
  nav.innerHTML = `<a href="${foodHref}" class="${foodActive ? 'on' : ''}">🍽 Рестораны и кафе<span class="badge${new7 ? ' hot' : ''}">${new7 ? '+' + new7 : foodTotal}</span></a>`
    + aud.map(([k, a]) => `<a href="#${k}" class="${active === k ? 'on' : ''}">${a.icon} ${a.name}<span class="badge">${summary.audience?.[k] || 0}</span></a>`).join('')
    + `<span class="sep"></span><a href="#settings" class="${active === 'settings' ? 'on' : ''}">⚙️ Шаблоны</a>`;
  // 2-й ряд — города (для ресторанов)
  subnav.hidden = !foodActive;
  if (foodActive) subnav.innerHTML = `<span class="lbl">Города:</span>`
    + `<a href="#new" class="${active === 'new' ? 'on' : ''}">🆕 Новые находки${new7 ? `<span class="badge hot">${new7}</span>` : ''}</a>`
    + cities.map((c) => `<a href="#${c.slug}" class="${active === c.slug ? 'on' : ''}">${esc(c.name)}${c.new7 ? `<span class="badge hot">+${c.new7}</span>` : `<span class="badge">${c.cis}</span>`}</a>`).join('');
}

async function route() {
  const page = location.hash.slice(1) || 'new';
  renderNav(page);
  try {
    if (page === 'new') await feedPage();
    else if (page === 'settings') settingsPage();
    else if (AUDIENCE[page]) await audiencePage(page);
    else await cityPage(page);
  } catch (e) { handleError(e); }
}

function loginScreen(msg = '') {
  nav.innerHTML = ''; subnav.hidden = true;
  app.innerHTML = `<div class="login"><h2 style="margin-top:0">Вход</h2>
    <div class="sub">Вставь токен из таблицы <code>gm_dashboard_tokens</code>. ${msg}</div>
    <input id="tok" placeholder="токен"><button class="btn" id="go">Войти</button></div>`;
  app.querySelector('#go').onclick = () => { token = app.querySelector('#tok').value.trim(); store.set('gm_token', token); start(); };
}

function handleError(e) {
  if (String(e.message).includes('forbidden')) return loginScreen('Токен не подошёл.');
  app.innerHTML = emptyText('Ошибка загрузки: ' + esc(e.message).slice(0, 300));
}

async function start() {
  document.getElementById('demo').hidden = !DEMO;
  if (!DEMO && !token) return loginScreen();
  try {
    [summary, settings] = await Promise.all([rpc('gm_dashboard_summary', {}), rpc('gm_get_settings', {})]);
    settings ||= {};
  } catch (e) { return handleError(e); }
  for (const k in cache) delete cache[k];
  route();
}
window.addEventListener('hashchange', () => { ui.view = 'new'; ui.viewChosen = false; ui.q = ''; ui.status = ''; ui.auCity = ''; ui.auSeg = 'cis'; route(); });

      ['Борщ & Сало', 'Украинский ресторан', 'тип: ukrainian_restaurant'], ['Shawarma Time', 'Шаурма', 'тип: shawarma_restaurant'], ['Mama Café', 'Русский ресторан', 'тип: russian_restaurant']];
    const clinics = ['Smile Dental', 'International Clinic', 'Dr. Lee Dentistry', 'Vinmec Hospital', 'Family Medical Practice', 'Bangkok Hospital', 'Royal Dental'];
    let n = 0;
    for (const [slug, , country] of cities) {
      names.forEach(([name, type, why], i) => {

        food.push({ place_id: `f${n++}`, city: slug, vertical: 'food', segment: why.startsWith('тип: hookah') ? 'maybe' : 'cis', segment_reason: why,
          name, type_label: type, rating: (4 + (i % 10) / 10).toFixed(1), reviews: isNew ? i % 6 : 40 + i * 13,
          phone_intl: country === 'VN' ? `+84 90 ${100 + i} ${20 + n} 55` : `+66 81 ${200 + i} ${30 + n}`, website: i % 3 ? null : 'https://example.com',
          maps_url: null, address: `${10 + i} Main St, ${slug}`, is_baseline: !isNew, first_seen: new Date(Date.now() - (i % 9) * 864e5).toISOString(),
          lead_status: i === 4 ? 'client' : i === 2 ? 'contacted' : 'new', notes: i === 2 ? 'написал в Zalo' : '', business_status: 'OPERATIONAL' });
      });
      if (slug === 'nha-trang') clinics.forEach((name, i) => {
        med.push({ place_id: `m${n++}`, city: slug, vertical: 'medical', segment: 'ru_audience', segment_reason: `отзывов на русском: ${2 + (i % 4)} из 8`,
          name, type_label: i % 2 ? 'Стоматологическая клиника' : 'Медицинский центр', rating: (4.3 + (i % 7) / 10).toFixed(1), reviews: 80 + i * 57,
          ru_reviews: 2 + (i % 4), reviews_sampled: 8, phone_intl: country === 'VN' ? `+84 258 ${300 + i} ${100 + n}` : `+66 38 ${400 + i} ${200 + n}`,
          website: 'https://example.com', address: `${i + 3} Clinic Rd`, is_baseline: true, first_seen: new Date().toISOString(), lead_status: 'new', notes: '' });
      });
    }
    return { food, med };
  })();
  const D = window._demo;
  if (fn === 'gm_dashboard_summary') return { cities: cities.map(([slug, name, country]) => ({ slug, name, country, active: true, baseline_left: 0,
    cis: D.food.filter((r) => r.city === slug && r.segment === 'cis').length,
    new7: D.food.filter((r) => r.city === slug && !r.is_baseline).length, last_run: new Date(Date.now() - 5 * 36e5).toISOString() })),
    audience: { medical: D.med.length } };
  if (fn === 'gm_dashboard') return (args.p_vertical === 'food' ? D.food : D.med).filter((r) => !args.p_city || r.city === args.p_city);
  return null;
}
